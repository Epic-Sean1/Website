<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick-Stop Hair Salon | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Quick-Stop Hair Salon</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Appointment & Booking Enquiry</h2>
        <p>Submit your details below to schedule an in-salon appointment or request an at-location visit.</p>

        <form action="#" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required placeholder="Enter contact number">

            <label for="service">Select Service:</label>
            <select id="service" name="service">
                <option value="braids">Braids & Extensions</option>
                <option value="treatment">Hair Treatment</option>
                <option value="cut">Cut & Wash</option>
                <option value="custom">At-Location Custom Styling</option>
            </select>

            <label for="message">Additional Notes / Preferred Time:</label>
            <textarea id="message" name="message" rows="4" placeholder="Let us know your preferred date and time or specific requirements..."></textarea>

            <button type="submit">Submit Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Quick-Stop Hair Salon. All Rights Reserved.</p>
    </footer>
</body>
</html>
